doc: |
  Benchmark uPCIe IOMMU overhead, host-memory buffers
  ===================================================

  Measures what an enforcing IOMMU costs when the data buffers live in host
  hugepages (`--be upcie`):

    1. boot with IOMMU disabled and collect uio_pci_generic results
    2. boot with IOMMU enabled and collect vfio-pci results
    3. combine both result sets and generate an HTML report

  It modifies `/etc/default/grub` on the target, reboots the machine twice, and
  waits for the CIJOE transport to return after each reboot.

  Both runners cover the condition. xnvmeperf reports one row summed over the
  devices it was given, fio reports one row per device, and latency and tail
  latency come from fio.

  Run `tasks/bench_iommu_overhead_gpu.yaml` for the same measurement with the
  buffers in GPU memory. An IOMMU delta is only meaningful between two runs
  whose buffers lived in the same kind of memory, so the two workflows collect
  and report separately. To read both in one report, point
  `iommu_overhead_combine --results-dir` at a directory holding both result
  sets: the report keys on `memory` and charts the two apart.

  Example:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/datasets.toml \
      -c configs/iommu_overhead.toml \
      tasks/bench_iommu_overhead_host.yaml

  Multi-device mode uses the same task and benchmark config, plus a config with
  top-level `[[devices]]` entries such as `configs/devices_16.toml`. Devices are
  pinned to the CPU an entry names with `cpu = N`, or to its position in the
  list when it names none. A run refuses to start when a CPU it would pin to is
  offline:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/datasets.toml \
      -c configs/devices_16.toml \
      -c configs/iommu_overhead.toml \
      tasks/bench_iommu_overhead_host.yaml

  Keep the devices and the CPUs they pin to on one NUMA node, so a device does
  not reach its buffers across the socket link. A run warns about a device
  pinned to a CPU on another node.

  Strict IOMMU invalidation is controlled by `iommu_strict` in
  `configs/iommu_overhead.toml` and is off by default. When enabled, the
  IOMMU-on boot uses `iommu.strict=1`. That only changes devices the kernel
  drives through the DMA API: vfio invalidates on every unmap anyway, and uPCIe
  maps its buffers once at bring-up, so the measured path does not see it.

  Requirements
  ------------
  vfio runs ask xNVMe for the iommufd path by name, as the GPU workflow does,
  so both kinds of memory are measured on the same IOMMU backend. That path
  maps uPCIe's heap with IOMMU_IOAS_MAP_FILE, which needs Linux 6.13 or newer.
  The first step checks the kernel and refuses before anything reboots.

  Recovery
  --------
  Before the first edit, the original grub config is copied to
  `/etc/default/grub.aisio-iommu-overhead.bak` on the target. If a reboot
  fails or the workflow is aborted in an unwanted boot state, restore with:

    cp /etc/default/grub.aisio-iommu-overhead.bak /etc/default/grub \
      && update-grub  # or: grub2-mkconfig -o /boot/grub2/grub.cfg

  and reboot.

steps:
  - name: check_kernel
    uses: iommu_boot
    with:
      mode: check-kernel

  - name: set_iommu_off
    uses: iommu_boot
    with:
      mode: set-off

  - name: reboot_iommu_off
    run: systemd-run --on-active=2 systemctl reboot

  - name: wait_down_iommu_off
    uses: core.wait_for_transport
    with:
      state: down
      timeout: 60

  - name: wait_up_iommu_off
    uses: core.wait_for_transport
    with:
      state: up
      timeout: 600

  - name: verify_iommu_off
    uses: iommu_boot
    with:
      mode: verify-off

  - name: benchmark_uio_host
    uses: iommu_overhead
    with:
      driver: uio_pci_generic
      label: uio
      memory: host

  - name: set_iommu_on
    uses: iommu_boot
    with:
      mode: set-on

  - name: reboot_iommu_on
    run: systemd-run --on-active=2 systemctl reboot

  - name: wait_down_iommu_on
    uses: core.wait_for_transport
    with:
      state: down
      timeout: 60

  - name: wait_up_iommu_on
    uses: core.wait_for_transport
    with:
      state: up
      timeout: 600

  - name: verify_iommu_on
    uses: iommu_boot
    with:
      mode: verify-on

  - name: benchmark_vfio_host
    uses: iommu_overhead
    with:
      driver: vfio-pci
      label: vfio
      memory: host

  - name: combine
    uses: iommu_overhead_combine

  - name: visualize
    uses: bench_visualize
    with:
      template: iommu-overhead
