doc: |
  Start the xnvme-devenv guest with a rig as the target
  =====================================================

  Boots the guest that 'configs/devenv_guest.toml' pins with the PCIe topology
  and devices of the rig given as a further config, using xnvme-devenv's rig
  scripts, which only its host container has, then plugs the rig's GPU, gpu0,
  and waits for amdgpu to bring it up. The rig is compute-node-emulated or one
  layered on it. Ends by recording what the guest has as facts, so a later run
  started with '--facts' knows the OS, kernel, NVMe controllers and GPUs it ran
  on. Needs KVM. 'make guest-start' runs it:

    cijoe --monitor \
      -c configs/devenv_guest.toml \
      -c /opt/xnvme-devenv/rigs/compute-node-emulated.toml \
      tasks/devenv_start.yaml

steps:
  - name: guest_kill
    uses: xnvme_devenv.rig_guest_kill
    with:
      guest_name: "{{ config.qemu.default_guest }}"

  - name: diskimage_from_oras
    uses: system_imaging.diskimage_from_oras
    with:
      pattern: "{{ config.qemu.default_systemimage }}"

  - name: guest_initialize
    uses: qemu.guest_initialize
    with:
      guest_name: "{{ config.qemu.default_guest }}"
      system_image_name: "{{ config.qemu.default_systemimage }}"

  - name: guest_start
    uses: xnvme_devenv.rig_guest_start
    with:
      guest_name: "{{ config.qemu.default_guest }}"

  - name: root_unlock
    uses: xnvme_devenv.root_unlock

  # The rig leaves the GPU out at boot, as amdgpu must be loaded with its
  # options before the GPU appears
  - name: gpu_plug
    uses: xnvme_devenv.rig_device_plug
    with:
      guest_name: "{{ config.qemu.default_guest }}"
      device_name: gpu0

  - name: gpu_up
    run: |
      for _ in $(seq 36); do test -e /dev/kfd && ls /dev/dri | grep -q renderD && break; sleep 5; done
      test -e /dev/kfd && ls /dev/dri | grep -q renderD || { dmesg | grep -i amdgpu | tail -40; false; }

  - name: guest_check
    run: |
      hostname
      uname -a
      df -h /
      lspci | grep -i 'non-volatile'
      lspci -d 1002:

  - name: facts
    uses: core.facts_gather
