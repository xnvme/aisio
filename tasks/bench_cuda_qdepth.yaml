doc: |
  Device-initiated I/O: Queue Depth Scaling
  ==========================================

  Characterises how IOPS scales with queue depth under device-initiated I/O,
  using xnvmeperf with the cuda-run subcommand and the upcie-cuda backend, with
  the number of queues per device as a secondary independent variable.

  Configuration file
  ------------------
  See `configs/devices_16.toml` for an example configuration file.

  The configuration file must also define a list of NVMe block devices. To find these,
  run

    `lspci | grep Non-Volatile`

  and change the `pci_addr` keys in the `[[devices]]` to match the PCI addresses of the
  found devices.

  Binding to userspace
  --------------------
  Step "bind_to_userspace" reserves hugepages and binds each device in `[[devices]]`
  to `[bench].driver`. It binds no other device, so an NVMe boot device stays on the
  kernel driver.

  xnvmeperf sizes its host heap at 256 MiB per queue, so the largest point of this
  sweep -- `nqueues` 16 -- needs 4 GiB. The step reserves 4096 hugepages of 2 MiB,
  8 GiB, which covers it with headroom.

  It is not necessary to run this step if the workflow is run repeatedly.

steps:
  - name: bind_to_userspace
    run: |
      hugepages setup --count 4096
      modprobe {{ config.bench.driver }}
      for device in {{ config.devices | map(attribute="pci_addr") | join(" ") }}; do devbind --device $device --bind {{ config.bench.driver }} || exit 1; done

  - name: run
    uses: bench_runall
    with:
      depths: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
      sizes: [512]
      numdevs_specific: [16]
      nqueues: [1, 2, 4, 8, 16]
      results_dir: &results-dir "{{ local.env.HOME }}/bench-cuda-results"
      tool: xnvmeperf-cuda
      backend: upcie-cuda

  - name: combine
    uses: bench_combine
    with:
      results_dir: *results-dir

  - name: lineplot_yaml
    uses: docs_plots_lineplot_cuda_qdepth
    with:
      path: *results-dir
