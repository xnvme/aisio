---
doc: |
  Install the NVIDIA driver + CUDA toolkit + DCGM on Ubuntu 26.04 (no GDS/DOCA)

  The NVIDIA mirror of setup_amdstack: the minimal driver + CUDA toolkit for
  NVMe<->GPU P2P, the open-kernel-module driver and the toolkit straight from
  apt. Deliberately NOT installed: MLNX_OFED, nvidia-gds / nvidia-peermem,
  nvidia-fs, and the BAM kernel-source build; AiSIO drives GPU-initiated NVMe
  I/O over the open dma-buf import path, not the proprietary GPUDirect-Storage
  / DOCA / BaM stack. nvbandwidth is built to /root/git/nvbandwidth to provide
  the PCIe peak-bandwidth reference used by the bench_pcie / bench_cuda_iosize
  experiments. DCGM (from the same NVIDIA CUDA repo) provides the GPU metric
  collection backend for the bench workflows; scripts/dcgm_helper.py talks to
  its nv-hostengine daemon via dcgmi. dcgm_helper additionally needs `screen`,
  installed by setup_ubuntu.yaml.

  Unlike setup_amdstack (amdgpu is in-tree), the NVIDIA driver is a DKMS module, so
  this reboots once to load it. On Ubuntu 26.04 the driver is 580-open from the
  distro 'restricted' repo; CUDA comes from NVIDIA's ubuntu2604 repo, which
  publishes only CUDA 13 (no 12.x) -- CUDA 13 satisfies xNVMe's '>=12.8'. CUDA
  installs under /usr/local/cuda-13.x; a /usr/local/cuda symlink and a
  /etc/profile.d/cuda.sh are wired up (non-interactive SSH still needs PATH set
  explicitly, as the build does).

  Run against a target whose default transport has root (e.g. via root_unlock):

    cijoe tasks/setup_nvstack.yaml --config configs/<target>.toml

steps:
- name: driver
  run: |
    apt-get -qy update
    DEBIAN_FRONTEND=noninteractive apt-get -qy install nvidia-driver-580-open

- name: reboot
  run: reboot

- name: wait_down
  uses: core.wait_for_transport
  with:
    state: down
    timeout: 90

- name: wait_up
  uses: core.wait_for_transport
  with:
    state: up
    timeout: 300

- name: cuda_repo
  run: |
    wget -qO /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
    dpkg -i /tmp/cuda-keyring.deb
    apt-get -qy update

- name: cuda
  run: |
    DEBIAN_FRONTEND=noninteractive apt-get -qy install cuda-toolkit-13
    ln -sfn "$(ls -d /usr/local/cuda-13* | sort -V | tail -1)" /usr/local/cuda

- name: cuda_profile
  run: |
    echo 'export PATH=/usr/local/cuda/bin:$PATH' | tee /etc/profile.d/cuda.sh
    echo 'export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH' | tee -a /etc/profile.d/cuda.sh
    chmod +x /etc/profile.d/cuda.sh

# DCGM: nv-hostengine daemon + dcgmi client, used by scripts/dcgm_helper.py to
# collect GPU metrics during the bench workflows. The service must run (as
# root, the systemd default) for the profiling fields (DCGM_FI_PROF_*) to be
# readable. The -cuda13 variant matches the driver 580 / CUDA 13 stack and
# bundles dcgmproftester13, the load generator used by
# scripts/validate_dcgm_helper.py.
- name: dcgm
  run: |
    DEBIAN_FRONTEND=noninteractive apt-get -qy install datacenter-gpu-manager-4-cuda13
    systemctl enable --now nvidia-dcgm

- name: check_gpu
  run: |
    nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total --format=csv,noheader

- name: check_toolkit
  run: |
    /usr/local/cuda/bin/nvcc --version | grep release

- name: check_libs
  run: |
    ldconfig -p | grep -iE "libcudart|libcuda\.so"

# hostengine reachable and GPU visible to DCGM; profiling-field support can be
# inspected on the target with `dcgmi profile -l -i 0`
- name: check_dcgm
  run: |
    dcgmi discovery -l

# the CUDA driver-api header the host stack builds against
- name: check_cuda_header
  run: |
    ls -l /usr/local/cuda/include/cuda.h

# nvbandwidth: the PCIe peak-bandwidth reference for the bench_pcie /
# bench_cuda_iosize experiments. The build needs Boost.ProgramOptions
# for the test-case selection interface.
- name: nvbandwidth
  run: |
    DEBIAN_FRONTEND=noninteractive apt-get -qy install git cmake build-essential libboost-program-options-dev
    rm -rf /root/git/nvbandwidth
    mkdir -p /root/git
    git clone --depth 1 https://github.com/NVIDIA/nvbandwidth.git /root/git/nvbandwidth
    export PATH=/usr/local/cuda/bin:$PATH
    cmake -S /root/git/nvbandwidth -B /root/git/nvbandwidth/build -DCMAKE_BUILD_TYPE=Release
    cmake --build /root/git/nvbandwidth/build -j "$(nproc)"
    ls -l /root/git/nvbandwidth/build/nvbandwidth
