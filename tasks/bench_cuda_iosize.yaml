doc: |
  Device-initiated I/O: I/O Size Scaling
  =======================================

  Characterises how few CUDA threads are needed to saturate the PCIe link under
  device-initiated I/O, using xnvmeperf with the cuda-run subcommand and the
  upcie-cuda backend. Queue depth is the secondary variable; with nqueues fixed
  at 1, the total CUDA thread count equals queue depth × number of devices.

  Configuration file
  ------------------
  See `configs/devices_16.toml` for an example configuration file.

  The configuration file must also define a list of NVMe block devices. To find these,
  run

    `lspci | grep Non-Volatile`

  and change the `pci_addr` keys in the `[[devices]]` to match the PCI addresses of the
  found devices.

  Binding to userspace
  --------------------
  Step "bind_to_userspace" reserves `[bench].hugepages` hugepages and binds each device
  in `[[devices]]` to `[bench].driver`. It binds no other device, so an NVMe boot device
  stays on the kernel driver.

  It is not necessary to run this step if the workflow is run repeatedly.

steps:
  - name: bind_to_userspace
    run: |
      hugepages setup --count {{ config.bench.hugepages }}
      modprobe {{ config.bench.driver }}
      for device in {{ config.devices | map(attribute="pci_addr") | join(" ") }}; do devbind --device $device --bind {{ config.bench.driver }} || exit 1; done

  - name: run
    uses: bench_runall
    with:
      depths: [1, 2, 4, 8, 16, 32, 64, 128]
      sizes: [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
      numdevs_specific: [16]
      nqueues: [1]
      results_dir: &results-dir "{{ local.env.HOME }}/bench-cuda-results"
      tool: xnvmeperf-cuda
      backend: upcie-cuda

  - name: nvbandwidth
    uses: nvbandwidth

  - name: combine
    uses: bench_combine
    with:
      results_dir: *results-dir

  - name: lineplot_yaml
    uses: docs_plots_lineplot_cuda_iosize
    with:
      path: *results-dir
