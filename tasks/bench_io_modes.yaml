doc: |
  Measure xnvmeperf in its I/O modes through homi
  ===============================================

  Random reads of [io_modes].iosize bytes, 10 s each, three times per mode,
  through homi started as the xnvme-homi@<homi_id> unit on every drive in
  [io_modes].devices. The modes, one step each, in the order they build on
  each other:

  - cpu_initiated_all, cpu_initiated_gpu_node: CPU-initiated I/O into host
    memory, on every drive, then on the drives of the GPU's NUMA node,
    [io_modes].devices_gpu
  - p2p: CPU-initiated P2P I/O into GPU memory, on those drives
  - p2p_cq_mirror: accelerator-assisted P2P I/O, the same with the completion
    queue mirrored into GPU memory
  - gpu_initiated: accelerator-initiated I/O, with the submission queue in host
    memory, after cuda-verify has checked the data; CUDA only, as xNVMe has no
    GPU-initiated I/O for HIP

  [io_modes].gpu_be is the xNVMe backend of the GPU, "upcie-cuda" or
  "upcie-hip", [io_modes].gpu_info the command that lists the GPU, and
  [io_modes].driver the driver the drives are bound to.

  Every command is its own entry in the report, with all it printed, so the
  figures are read from there rather than filtered here. Every CPU is held at
  [io_modes].frequency_khz while measuring, and frequency_restore puts the
  range back. The drives are only read, and should be formatted beforehand, so
  every block is deallocated; the IOMMU mode is whatever the machine booted
  with, which 'system' shows first. All of it:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/io_modes_dellr760.toml \
      tasks/bench_io_modes.yaml

  Name steps to run only those, e.g. CPU-initiated I/O alone:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/io_modes_dellr760.toml \
      tasks/bench_io_modes.yaml \
      stack_check system drive_guard bind homi_start cpu_initiated_all homi_stop

steps:
  - name: stack_check
    uses: stack_check

  - name: system
    run: |
      iommu show
      xnvme library-info
      {{ config.io_modes.gpu_info }}

  - name: drive_guard
    uses: drive_guard
    with:
      devices: ["{{ config.io_modes.devices | join(' ') }}"]

  - name: bind
    run: |
      modprobe {{ config.io_modes.driver }}
      for device in {{ config.io_modes.devices | join(" ") }}; do devbind --device $device --bind {{ config.io_modes.driver }} || exit 1; done
      lspci -Dk -d ::0108

  - name: frequency
    run: |
      for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_max_freq; do echo {{ config.io_modes.frequency_khz }} > $f; done
      for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_min_freq; do echo {{ config.io_modes.frequency_khz }} > $f; done
      for c in $(echo {{ config.io_modes.cpulist }} | tr , ' '); do grep -H . /sys/devices/system/cpu/cpu$c/cpufreq/scaling_min_freq /sys/devices/system/cpu/cpu$c/cpufreq/scaling_max_freq || exit 1; done

  - name: homi_start
    run: |
      sync; echo 3 > /proc/sys/vm/drop_caches; echo 1 > /proc/sys/vm/compact_memory
      hugepages setup --count {{ config.io_modes.hugepages }}
      n=$(cat /proc/sys/vm/nr_hugepages); [ "$n" -ge {{ config.io_modes.hugepages }} ] || { echo "only $n of {{ config.io_modes.hugepages }} hugepages could be reserved"; exit 1; }
      systemctl stop xnvme-homi@{{ config.io_modes.homi_id }}
      mkdir -p {{ config.aisio.xnvme_confdir }}
      printf '%s\n' 'HOMI_DEVICES={{ config.io_modes.devices | join(" ") }}' 'HOMI_OPTS=--be upcie' > {{ config.aisio.xnvme_confdir }}/homi-{{ config.io_modes.homi_id }}.conf
      systemctl reset-failed xnvme-homi@{{ config.io_modes.homi_id }} || true
      systemctl start xnvme-homi@{{ config.io_modes.homi_id }}
      systemctl status --no-pager xnvme-homi@{{ config.io_modes.homi_id }}

  - name: cpu_initiated_all
    run: |
      xnvmeperf run {{ config.io_modes.devices | join(" ") }} --cpulist {{ config.io_modes.cpulist }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices | join(" ") }} --cpulist {{ config.io_modes.cpulist }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices | join(" ") }} --cpulist {{ config.io_modes.cpulist }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}

  - name: cpu_initiated_gpu_node
    run: |
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be upcie --homi-id {{ config.io_modes.homi_id }}

  - name: p2p
    run: |
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }}
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }}

  - name: p2p_cq_mirror
    run: |
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --p2p-cq-mirror
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --p2p-cq-mirror
      xnvmeperf run {{ config.io_modes.devices_gpu | join(" ") }} --cpulist {{ config.io_modes.cpulist_gpu }} --iopattern randread --qdepth 128 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --p2p-cq-mirror

  - name: gpu_initiated
    run: |
      xnvmeperf cuda-verify {{ config.io_modes.devices_gpu | join(" ") }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --iosize 4096 --qdepth 32 --nqueues 1
      xnvmeperf cuda-run {{ config.io_modes.devices_gpu | join(" ") }} --iopattern randread --qdepth 256 --nqueues 1 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --sq-hostmem
      xnvmeperf cuda-run {{ config.io_modes.devices_gpu | join(" ") }} --iopattern randread --qdepth 256 --nqueues 1 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --sq-hostmem
      xnvmeperf cuda-run {{ config.io_modes.devices_gpu | join(" ") }} --iopattern randread --qdepth 256 --nqueues 1 --runtime 10 --iosize {{ config.io_modes.iosize }} --be {{ config.io_modes.gpu_be }} --gpu-id {{ config.io_modes.gpu_id }} --homi-id {{ config.io_modes.homi_id }} --sq-hostmem

  - name: homi_stop
    run: |
      systemctl stop xnvme-homi@{{ config.io_modes.homi_id }}
      r=$(systemctl show -p Result --value xnvme-homi@{{ config.io_modes.homi_id }}); echo "Result=$r"; [ "$r" = success ]

  - name: frequency_restore
    run: |
      for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_min_freq; do echo {{ config.io_modes.frequency_restore_min_khz }} > $f; done
      for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_max_freq; do echo {{ config.io_modes.frequency_restore_max_khz }} > $f; done
      for c in $(echo {{ config.io_modes.cpulist }} | tr , ' '); do grep -H . /sys/devices/system/cpu/cpu$c/cpufreq/scaling_min_freq /sys/devices/system/cpu/cpu$c/cpufreq/scaling_max_freq || exit 1; done
