doc: |
  Run I/O benchmarks for different tools
  ======================================

  Configuration file
  ------------------
  See `configs/devices_16.toml` for an example configuration file.

  The configuration file must also define a list of NVMe block devices. To find these,
  run

    `lspci | grep Non-Volatile`

  and change the `pci_addr` keys in the `[[devices]]` to match the PCI addresses of the
  found devices.

  Binding to userspace
  --------------------
  Step "bind_to_userspace" reserves `[bench].hugepages` hugepages and binds each device
  in `[[devices]]` to `[bench].driver`. It binds no other device, so an NVMe boot device
  stays on the kernel driver.

  It is not necessary to run this step if the workflow is run repeatedly.

steps:
  - name: bind_to_userspace
    run: |
      hugepages setup --count {{ config.bench.hugepages }}
      modprobe {{ config.bench.driver }}
      for device in {{ config.devices | map(attribute="pci_addr") | join(" ") }}; do devbind --device $device --bind {{ config.bench.driver }} || exit 1; done

  - name: bdevperf
    uses: bench_runall
    with:
      depths: &qd [128]
      sizes: &io [512]
      numcpus_specific: &cpus [1, 2]  # 4 hardware threads
      numdevs_specific: &devs [16]
      cpu_freqs: &cpufreq ["performance"]
      turbo: &turbo [1]
      smt: &smt [1]
      hyperthreads: &ht [1]
      stress: &stress [0]
      results_dir: &results-dir "{{ local.env.HOME }}/bench-results"
      tool: bdevperf

  - name: spdk_nvme_perf
    uses: bench_runall
    with:
      depths: *qd
      sizes: *io
      numcpus_specific: *cpus
      numdevs_specific: *devs
      cpu_freqs: *cpufreq
      turbo: *turbo
      smt: *smt
      hyperthreads: *ht
      stress: *stress
      results_dir: *results-dir
      tool: spdk_nvme_perf

  - name: xnvmeperf_spdk
    uses: bench_runall
    with:
      depths: *qd
      sizes: *io
      numcpus_specific: *cpus
      numdevs_specific: *devs
      cpu_freqs: *cpufreq
      turbo: *turbo
      smt: *smt
      hyperthreads: *ht
      stress: *stress
      results_dir: *results-dir
      tool: xnvmeperf
      backend: spdk

  - name: xnvmeperf_upcie
    uses: bench_runall
    with:
      depths: *qd
      sizes: *io
      numcpus_specific: *cpus
      numdevs_specific: *devs
      cpu_freqs: *cpufreq
      turbo: *turbo
      smt: *smt
      hyperthreads: *ht
      stress: *stress
      results_dir: *results-dir
      tool: xnvmeperf
      backend: upcie

  - name: xnvmeperf_upcie_cuda
    uses: bench_runall
    with:
      depths: *qd
      sizes: *io
      numcpus_specific: *cpus
      numdevs_specific: *devs
      cpu_freqs: *cpufreq
      turbo: *turbo
      smt: *smt
      hyperthreads: *ht
      stress: *stress
      results_dir: *results-dir
      tool: xnvmeperf
      backend: upcie-cuda

  - name: combine
    uses: bench_combine
    with:
      results_dir: *results-dir

  - name: visualize
    uses: bench_visualize
    with:
      template: benchmark-tools

  - name: barplot_yaml
    uses: docs_plots_barplot_tool
    with:
      path: *results-dir
