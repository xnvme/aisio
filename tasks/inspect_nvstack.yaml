doc: |
  Inspect the state of the nvstack

steps:
  - name: modules
    run: |
      uname -r
      lsmod | grep -E 'nvidia(_uvm)?'

  - name: block
    run: lsblk -f

  - name: pcie
    run: lspci -t

  - name: gpu
    run: nvidia-smi topo -m
