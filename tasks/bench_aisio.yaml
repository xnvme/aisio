doc: |
  Run benchmarks to evaluate AiSIO performance
  ============================================

  The benchmarks include:
  - performing synthetic randread benchmarks for: upcie, upcie-cuda
  - reading 3 datasets: tiktokish, imagenetish, filesize8gib

  The task starts homi on the controller, qublk serving the dataset volume,
  mounted, and xal-server publishing its index as /xal_dev0. xnvmeperf and FIL's
  aisio backends then read through homi, and the task stops the daemons again.
  It leaves the controller bound to uio_pci_generic. This assumes you already
  ran 'setup_aisio.yaml' and 'setup_dataset.yaml', and it does not format
  anything:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/datasets.toml \
      tasks/bench_aisio.yaml

  When a step fails, the daemons are left running, and a new run stops them
  first.

steps:
  - name: prepare
    run: |
      umount {{ config.filesystems.dset.mountpoint }} || true
      systemctl stop xal-server xnvme-qublk@1 xnvme-homi@1
      if [ -e /dev/ublkc1 ]; then qublk del --dev-id 1; fi
      rm -f /dev/shm/xal_dev0_*
      modprobe uio_pci_generic
      modprobe ublk_drv
      devbind --device {{ config.filesystems.dset.pci_addr }} --bind uio_pci_generic
      hugepages setup --count 5120

  # The heap holds the buffers of aisio-cpu, a batch of them, each the size of
  # the largest file, so filesize8gib drives it to 9 GiB
  - name: units_configure
    run: |
      mkdir -p /usr/local/etc/xnvme /usr/local/etc/xal
      printf '%s\n' 'HOMI_DEVICES={{ config.filesystems.dset.pci_addr }}' 'HOMI_OPTS=--be upcie --host_heap_size 9663676416' > /usr/local/etc/xnvme/homi-1.conf
      printf '%s\n' 'QUBLK_URI={{ config.filesystems.dset.pci_addr }}' 'QUBLK_OPTS=--be upcie --homi-id 1' > /usr/local/etc/xnvme/qublk-1.conf
      printf '%s\n' 'log_level = 3' 'devices = [' '  { uri = "/dev/ublkb1", shm_name = "/xal_dev0", mountpoint = "{{ config.filesystems.dset.mountpoint }}" },' ']' '[xal]' 'watchmode = 2' > /usr/local/etc/xal/xal-server.conf

  # xal-server's unit reports started when the process starts, before it has
  # indexed
  - name: daemons_start
    run: |
      systemctl start xnvme-homi@1
      systemctl start xnvme-qublk@1
      mount -o noatime /dev/ublkb1 {{ config.filesystems.dset.mountpoint }}
      df -h {{ config.filesystems.dset.mountpoint }}
      systemctl start xal-server
      timeout 60 sh -c 'until journalctl --no-pager _SYSTEMD_INVOCATION_ID=$(systemctl show -p InvocationID --value xal-server) | grep -q "serving 1 device"; do sleep 1; done'

  - name: cpu-initiated
    uses: xnvmeperf
    with:
      backend: "upcie"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      runtime: 10
      iosize: 512
      qdepth: 128
      iopattern: randread
      homi_id: 1

  - name: p2p
    uses: xnvmeperf
    with:
      backend: "upcie-cuda"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      runtime: 10
      iosize: 512
      qdepth: 128
      iopattern: randread
      homi_id: 1

  - name: dev-initiated
    uses: xnvmeperf
    with:
      command: "cuda-run"
      backend: "upcie-cuda"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      nqueues: 4
      runtime: 10
      iosize: 512
      qdepth: 512
      iopattern: randread
      homi_id: 1

  - name: tiktokish
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 26
      batches: 1

  - name: tiktokish-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 26
      batches: 1
      queue_depth: 512

  - name: tiktokish-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 26
      batches: 1

  - name: imagenetish
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1024
      batches: 300

  - name: imagenetish-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1024
      batches: 300
      queue_depth: 512

  - name: imagenetish-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1024
      batches: 300

  - name: filesize8gib
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1
      batches: 10

  - name: filesize8gib-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1
      batches: 10
      queue_depth: 512

  - name: filesize8gib-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      batch_size: 1
      batches: 10

  - name: daemons_stop
    run: |
      systemctl stop xal-server
      umount {{ config.filesystems.dset.mountpoint }}
      systemctl stop xnvme-qublk@1
      systemctl stop xnvme-homi@1
