doc: |
  Run benchmarks to evaluate AiSIO performance
  ============================================

  The benchmarks include:
  - performing synthetic randread benchmarks for: upcie, upcie-cuda
  - reading 3 datasets: tiktokish, imagenetish, filesize8gib

  The task starts homi on the controller, qublk serving the dataset volume,
  mounted, and xal-server publishing its index, as [aisio] names them. xnvmeperf
  and FIL's aisio backends then read through homi, and the task stops the
  daemons again. This assumes you already ran 'setup_aisio.yaml',
  'setup_dataset.yaml' and 'configure_daemons.yaml', and it does not format
  anything:

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      -c configs/datasets.toml \
      tasks/bench_aisio.yaml

  When a step fails, the daemons are left running, and 'configure_daemons.yaml'
  stops them.

steps:
  # xal-server's unit reports started when the process starts, before it has
  # indexed
  - name: daemons_start
    run: |
      systemctl start xnvme-homi@{{ config.aisio.homi_id }}
      systemctl start xnvme-qublk@{{ config.aisio.ublk_id }}
      mount -o noatime /dev/ublkb{{ config.aisio.ublk_id }} {{ config.filesystems.dset.mountpoint }}
      df -h {{ config.filesystems.dset.mountpoint }}
      systemctl start xal-server
      timeout 60 sh -c 'until journalctl --no-pager _SYSTEMD_INVOCATION_ID=$(systemctl show -p InvocationID --value xal-server) | grep -q "serving 1 device"; do sleep 1; done'

  - name: cpu-initiated
    uses: xnvmeperf
    with:
      backend: "upcie"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      runtime: 10
      iosize: 512
      qdepth: 128
      iopattern: randread
      homi_id: "{{ config.aisio.homi_id }}"

  - name: p2p
    uses: xnvmeperf
    with:
      backend: "upcie-cuda"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      runtime: 10
      iosize: 512
      qdepth: 128
      iopattern: randread
      homi_id: "{{ config.aisio.homi_id }}"

  - name: dev-initiated
    uses: xnvmeperf
    with:
      command: "cuda-run"
      backend: "upcie-cuda"
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      nqueues: 4
      runtime: 10
      iosize: 512
      qdepth: 512
      iopattern: randread
      homi_id: "{{ config.aisio.homi_id }}"

  - name: tiktokish
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 26
      batches: 1

  - name: tiktokish-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 26
      batches: 1
      queue_depth: 512

  - name: tiktokish-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "tiktokish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 26
      batches: 1

  - name: imagenetish
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1024
      batches: 300

  - name: imagenetish-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1024
      batches: 300
      queue_depth: 512

  - name: imagenetish-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "imagenetish"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1024
      batches: 300

  - name: filesize8gib
    uses: filperf
    with:
      backend: "aisio-cpu"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1
      batches: 10

  - name: filesize8gib-gpu
    uses: filperf
    with:
      backend: "aisio-gpu"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1
      batches: 10
      queue_depth: 512

  - name: filesize8gib-p2p
    uses: filperf
    with:
      backend: "aisio-p2p"
      dataset: "filesize8gib"
      device: "{{ config.filesystems.dset.pci_addr }}"
      homi_id: "{{ config.aisio.homi_id }}"
      xal_shm: "{{ config.aisio.xal_shm_name }}"
      batch_size: 1
      batches: 10

  - name: daemons_stop
    run: |
      systemctl stop xal-server
      umount {{ config.filesystems.dset.mountpoint }}
      systemctl stop xnvme-qublk@{{ config.aisio.ublk_id }}
      systemctl stop xnvme-homi@{{ config.aisio.homi_id }}
