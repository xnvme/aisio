doc: |
  Format a block device with XFS and populate it with pseudo-datasets

  Run it like so:

    cijoe \
      -c configs/transport.toml \
      -c configs/datasets.toml \
      tasks/setup_dataset.yaml \
      --monitor

  See README.md for device configuration in datasets.toml.

steps:
  - name: drive_guard
    uses: drive_guard
    with:
      devices: ["{{ config.filesystems.dset.pci_addr }}"]
      mountpoint: "{{ config.filesystems.dset.mountpoint }}"

  - name: filesystem
    run: |
      for _ in $(seq 50); do test -b {{ config.filesystems.dset.bdev }} && break; sleep 0.2; done; test -b {{ config.filesystems.dset.bdev }}
      ns=$(for blk in /sys/block/nvme*n*; do case "${blk##*/}" in *c*) continue ;; esac; for dev in "$blk" "$blk"/multipath/*; do case "$(readlink -f "$dev/device")" in */{{ config.filesystems.dset.pci_addr }}/*) echo "/dev/${blk##*/}" ;; esac; done; done | sort -u); [ "$ns" = "{{ config.filesystems.dset.bdev }}" ] || { echo "{{ config.filesystems.dset.bdev }} is not the namespace of {{ config.filesystems.dset.pci_addr }}, which is '$ns'; refusing to format it"; exit 1; }
      lsblk -f
      umount {{ config.filesystems.dset.mountpoint }} || true
      mkfs.xfs -f -m reflink=0 {{ config.filesystems.dset.bdev }}
      mkdir -p {{ config.filesystems.dset.mountpoint }}
      mount -o noatime {{ config.filesystems.dset.bdev }} {{ config.filesystems.dset.mountpoint }}
      df -h

  - name: filesize8gib_generate
    uses: generate_dataset
    with:
      dataset_name: "filesize8gib"

  - name: filesize8gib_stats
    run: |
      df -h
      du -h {{ config.datasets.filesize8gib.path }} --max-depth=1

  - name: tiktokish_generate
    uses: generate_dataset
    with:
      dataset_name: "tiktokish"

  - name: tiktokish_stats
    run: |
      df -h
      du -h {{ config.datasets.tiktokish.path }} --max-depth=1

  - name: imagenetish_generate
    uses: generate_dataset
    with:
      dataset_name: "imagenetish"

  - name: imagenetish_stats
    run: |
      df -h
      du -h {{ config.datasets.imagenetish.path }} --max-depth=1

  - name: defrag
    run: |
      xfs_fsr -v {{ config.filesystems.dset.mountpoint }}
