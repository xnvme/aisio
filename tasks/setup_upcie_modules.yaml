doc: |
  Install the uPCIe kernel modules
  ================================

  uPCIe releases the out-of-tree modules its experimental paths build on as a
  single DKMS package, 'upcie-experimental-dkms', so they build against the
  running kernel and rebuild themselves on kernel updates. The stock Ubuntu GA
  kernel is all that is required.

  The package ships two modules and loads both:

  * dmabuf_import serves the dma-buf import ioctls on '/dev/dmabuf_import'. It
    resolves the DMA addresses of a dma-buf exported by a GPU runtime, which is
    what lets xNVMe address device memory in the commands it submits.

  * iommu_map_pa serves IOMMU_MAP_PA / IOMMU_UNMAP_PA on '/dev/iommu_map_pa'.
    It installs physical addresses into the IOMMU domain a device uses, which
    reaches GPU memory for P2P DMA without disabling the IOMMU.

  The package installs both UAPI headers under '/usr/include/linux/'. uPCIe
  compiles an experimental path only when its header is present, so run this
  before 'setup_aisio.yaml' builds xNVMe; otherwise those paths are built as
  stubs returning -ENOTSUP.

  This can be run with::

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      tasks/setup_upcie_modules.yaml

  Adjust transport.toml with the hostname and ssh-login info of the root user.

steps:
  - name: download
    run: |
      wget -qO /tmp/upcie-experimental-dkms_{{ config.upcie.dkms.version }}_all.deb {{ config.upcie.dkms.remote }}/releases/download/v{{ config.upcie.dkms.version }}/upcie-experimental-dkms_{{ config.upcie.dkms.version }}_all.deb

  - name: install
    run: |
      apt-get -qy update
      DEBIAN_FRONTEND=noninteractive apt-get -qy install /tmp/upcie-experimental-dkms_{{ config.upcie.dkms.version }}_all.deb

  - name: check_modules
    run: |
      dkms status | grep upcie-experimental/{{ config.upcie.dkms.version }}
      lsmod | grep dmabuf_import
      lsmod | grep iommu_map_pa
      ls -l /dev/dmabuf_import /dev/iommu_map_pa
      ls -l /usr/include/linux/dmabuf_import.h /usr/include/linux/iommu_map_pa.h
