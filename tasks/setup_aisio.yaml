doc: |
  AiSIO PoC Setup using the NVIDIA Software-Stack
  ===============================================

  Assuming you installed the system along the lines of the 'setup_nvstack.yaml'.

  With the above in place then run this workflow e.g.

    cijoe --monitor \
      -c configs/transport.toml \
      -c configs/aisio.toml \
      tasks/setup_aisio.yaml

  Adjusting transport.toml with the hostname and ssh-login info of the root user.

steps:
  - name: fetch_sources
    uses: core.repository_prep

  - name: python_tools
    run: |
      pipx install devbind
      pipx install hugepages
      pipx ensurepath

  - name: xnvme
    run: |
      chmod +x "{{ config.xnvme.repository.path }}/toolbox/pkgs/{{ config.xnvme.pkgs }}.sh"
      cd "{{ config.xnvme.repository.path }}"; XNVME_PKGS_NO_UPGRADE=1 ./toolbox/pkgs/{{ config.xnvme.pkgs }}.sh
      DEBIAN_FRONTEND=noninteractive apt-get install -qy systemd-dev
      rm -r "{{ config.xnvme.repository.path }}/builddir" || true
      mkdir -p "{{ config.xnvme.repository.path }}/builddir"
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.xnvme.repository.path }}"; meson setup builddir {{ config.xnvme.setup_args }}
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.xnvme.repository.path }}"; meson install -C builddir

  - name: xal
    run: |
      apt-get install -fy xfslibs-dev clang libbpf-dev libelf-dev zlib1g-dev
      rm -r "{{ config.xal.repository.path }}/builddir" || true
      mkdir -p "{{ config.xal.repository.path }}/builddir"
      cd "{{ config.xal.repository.path }}"; meson setup builddir -Dxal-server=enabled
      cd "{{ config.xal.repository.path }}"; meson install -C builddir
      systemctl daemon-reload
      systemctl cat xnvme-homi@1 xnvme-qublk@1 xal-server > /dev/null

  - name: fil
    run: |
      rm -r "{{ config.fil.repository.path }}/builddir" || true
      mkdir -p "{{ config.fil.repository.path }}/builddir"
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.fil.repository.path }}"; meson setup builddir
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.fil.repository.path }}"; meson install -C builddir

  # Which backends it builds depends on what the system has, so it says;
  # the reference one is checked on the root filesystem, as /tmp may be a
  # tmpfs, which rejects O_DIRECT
  - name: opends
    run: |
      rm -r "{{ config.opends.repository.path }}/builddir" || true
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.opends.repository.path }}"; meson setup builddir
      [ ! -f /etc/profile.d/cuda.sh ] || . /etc/profile.d/cuda.sh; cd "{{ config.opends.repository.path }}"; meson install -C builddir
      ldconfig
      ls "{{ config.opends.repository.path }}"/builddir/libopends_*.so
      "{{ config.opends.repository.path }}/builddir/test_smoke_ref" /root

  - name: fio
    run: |
      cd "{{ config.fio.repository.path }}"; ./configure; make; make install

  - name: spdk
    run: |
      cd "{{ config.spdk.repository.path }}"; ./scripts/pkgdep.sh
      cd "{{ config.spdk.repository.path }}"; ./configure --disable-unit-tests --disable-tests --enable-lto --with-fio="{{ config.fio.repository.path }}" --without-crypto --without-idxd --without-iscsi-initiator --without-nvme-cuse --without-ocf --without-rbd --without-uring --without-usdt --without-vfio-user --without-vhost --without-virtio --without-vtune --without-xnvme
      cd "{{ config.spdk.repository.path }}"; make -j $(nproc)
