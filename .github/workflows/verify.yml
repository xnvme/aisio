name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Loads every workflow against the configs; the benchmarks get no other coverage
  lint:
    runs-on: ubuntu-latest

    # the container the provisioning jobs run, with the cijoe they pin
    container:
      image: ghcr.io/safl/nosi/ubuntu-2604-docker@sha256:45d7ba1fdd05d8f562051ae58a2f4f2370e6c9958a8b27dd543e2a836ccc28db

    steps:
      - name: Grab source
        uses: actions/checkout@v7.0.0

      # The image's cijoe moves with the image; the configs need 0.9.69 or later
      - name: Pin cijoe
        run: &cijoe |
          cijoe_python="$(dirname "$(readlink -f "$(command -v cijoe)")")/python"
          "$cijoe_python" -m ensurepip --upgrade >/dev/null
          "$cijoe_python" -m pip install --quiet cijoe==0.9.70

      - name: Lint the cijoe workflows
        run: |
          cijoe_python="$(dirname "$(readlink -f "$(command -v cijoe)")")/python"
          "$cijoe_python" .github/scripts/cijoe_lint.py -x tasks/devenv_start.yaml

  # README.md Steps 2-7 in a QEMU guest, less the steps that need a GPU
  provision:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: ghcr.io/safl/nosi/ubuntu-2604-docker@sha256:45d7ba1fdd05d8f562051ae58a2f4f2370e6c9958a8b27dd543e2a836ccc28db
      options: --privileged -v /mnt:/mnt

    steps:
      - name: Grab source
        uses: actions/checkout@v7.0.0

      - name: Pin cijoe
        run: *cijoe

      - name: Prepare environment
        run: &prepare |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          cijoe_python="$(dirname "$(readlink -f "$(command -v cijoe)")")/python"
          echo "CIJOE_PYTHON=$cijoe_python" >> $GITHUB_ENV
          # the guest images overflow the container overlay
          mkdir -p /mnt/system_imaging /mnt/guests
          ln -sfn /mnt/system_imaging "$HOME/system_imaging"
          ln -sfn /mnt/guests "$HOME/guests"

      - name: guest_start.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -o cijoe-output/guest_start \
            tasks/guest_start.yaml

      - name: setup_ubuntu.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -o cijoe-output/setup_ubuntu \
            tasks/setup_ubuntu.yaml

      - name: setup_upcie_modules.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -c configs/aisio.toml \
            -o cijoe-output/setup_upcie_modules \
            tasks/setup_upcie_modules.yaml

      - name: setup_nvstack.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -o cijoe-output/setup_nvstack \
            tasks/setup_nvstack.yaml \
            $("$CIJOE_PYTHON" .github/scripts/cijoe_steps.py tasks/setup_nvstack.yaml --skip check_gpu)

      - name: setup_aisio.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -c configs/aisio.toml \
            -o cijoe-output/setup_aisio \
            tasks/setup_aisio.yaml

      - name: setup_dataset.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -c configs/datasets.toml \
            -c configs/datasets_small.toml \
            -o cijoe-output/setup_dataset \
            tasks/setup_dataset.yaml

      # Formats the dataset device again, so it runs last
      - name: smoke_daemons.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -c configs/smoke.toml \
            -o cijoe-output/smoke_daemons \
            tasks/smoke_daemons.yaml

      # A failed step leaves the daemons running with their logs unread
      - name: Daemon logs
        if: failure()
        run: |
          cijoe \
            -c configs/qemu_guest.toml \
            -c configs/smoke.toml \
            -o cijoe-output/smoke_daemons_logs \
            tasks/smoke_daemons.yaml logs || true

      - name: Guest serial console
        if: failure()
        run: &serial |
          tail -c 20000 "$HOME/guests/ubuntu-2604-amd64/serial.output" 2>/dev/null \
            || echo "no guest serial output"

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provision-cijoe-output
          path: cijoe-output/
          if-no-files-found: warn

  # setup_aisio.yaml and smoke_daemons.yaml on a system AiSIO did not set up:
  # the xnvme-devenv guest, with ROCm installed and no CUDA, booted on
  # xnvme-devenv's storage-node-emulated rig. It relies on the TEMPORARY fil
  # pin in configs/aisio.toml and package script in configs/devenv_guest.toml.
  devenv:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # xnvme-devenv v0.15.0, whose guest configs/devenv_guest.toml pins
    container:
      image: ghcr.io/xnvme/xnvme-devenv/host:v0.15.0
      options: --privileged -v /mnt:/mnt

    env:
      RIG: /opt/xnvme-devenv/rigs/storage-node-emulated.toml

    steps:
      - name: Grab source
        uses: actions/checkout@v7.0.0

      - name: Prepare environment
        run: *prepare

      # The general lint runs where xnvme-devenv's scripts are not installed
      - name: Lint devenv_start.yaml
        run: |
          "$CIJOE_PYTHON" .github/scripts/cijoe_lint.py \
            -c configs/devenv_guest.toml -c "$RIG" \
            tasks/devenv_start.yaml

      - name: devenv_start.yaml
        run: |
          cijoe --monitor \
            -c configs/devenv_guest.toml \
            -c "$RIG" \
            -o cijoe-output/devenv_start \
            tasks/devenv_start.yaml

      # configs/devenv_guest.toml last, so its [os] is the guest's own
      - name: setup_aisio.yaml
        run: |
          cijoe --monitor \
            -c configs/aisio.toml \
            -c configs/devenv_guest.toml \
            --facts cijoe-output/devenv_start/facts.toml \
            -o cijoe-output/setup_aisio \
            tasks/setup_aisio.yaml

      - name: smoke_daemons.yaml
        run: |
          cijoe --monitor \
            -c configs/devenv_guest.toml \
            -c configs/smoke.toml \
            -o cijoe-output/smoke_daemons \
            tasks/smoke_daemons.yaml

      - name: Daemon logs
        if: failure()
        run: |
          cijoe \
            -c configs/devenv_guest.toml \
            -c configs/smoke.toml \
            -o cijoe-output/smoke_daemons_logs \
            tasks/smoke_daemons.yaml logs || true

      - name: Guest serial console
        if: failure()
        run: |
          tail -c 20000 "$HOME/guests/ubuntu-2610-rocm-amd64/serial.output" 2>/dev/null \
            || echo "no guest serial output"

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devenv-cijoe-output
          path: cijoe-output/
          if-no-files-found: warn

  # setup_amdstack.yaml in a guest of its own, less the checks that need a GPU
  amdstack:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: ghcr.io/safl/nosi/ubuntu-2604-docker@sha256:45d7ba1fdd05d8f562051ae58a2f4f2370e6c9958a8b27dd543e2a836ccc28db
      options: --privileged -v /mnt:/mnt

    steps:
      - name: Grab source
        uses: actions/checkout@v7.0.0

      - name: Pin cijoe
        run: *cijoe

      - name: Prepare environment
        run: *prepare

      - name: guest_start.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -o cijoe-output/guest_start \
            tasks/guest_start.yaml

      - name: setup_amdstack.yaml
        run: |
          cijoe --monitor \
            -c configs/qemu_guest.toml \
            -o cijoe-output/setup_amdstack \
            tasks/setup_amdstack.yaml \
            $("$CIJOE_PYTHON" .github/scripts/cijoe_steps.py tasks/setup_amdstack.yaml --skip check_kfd_dri check_rocminfo)

      - name: Guest serial console
        if: failure()
        run: *serial

      - name: Upload cijoe output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: amdstack-cijoe-output
          path: cijoe-output/
          if-no-files-found: warn
