[os]
distro = "ubuntu"
version = "resolute"

# A commit on main, as no xNVMe release has the upcie backends AiSIO builds on;
# core.repository_prep checks out whatever 'tag' names
[xnvme.repository]
remote = "https://github.com/xnvme/xnvme"
tag = "6a194b7a1b5a636c2e68170c9105b66f31b659e0"
path = "/root/git/xnvme"

# The experimental package carries the version of the uPCIe release it ships
# with, so one value names both.
[upcie.dkms]
remote = "https://github.com/safl/upcie"
version = "0.9.0"

[xal.repository]
remote = "https://github.com/xnvme/xal"
tag = "v0.3.3"
path = "/root/git/xal"

[fil.repository]
remote = "https://github.com/xnvme/fil"
tag = "v0.3.4"
path = "/root/git/fil"

[spdk.repository]
remote = "https://github.com/spdk/spdk"
tag = "v26.01"
path = "/root/git/spdk"

[fio.repository]
remote = "https://github.com/axboe/fio"
tag = "fio-3.41"
path = "/root/git/fio"
