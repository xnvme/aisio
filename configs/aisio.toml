[os]
distro = "ubuntu"
version = "resolute"

[xnvme.repository]
remote = "https://github.com/xnvme/xnvme"
branch = "main"
path = "/root/git/xnvme"

[upcie.dkms]
remote = "https://github.com/safl/upcie"
release = "v0.6.0"

# Each DKMS package carries its own version, which is unrelated to the uPCIe
# release above that publishes it as a '.deb' asset.
[upcie.dkms.packages]
dmabuf_import = "0.2.0"

[xal.repository]
remote = "https://github.com/xnvme/xal"
tag = "v0.3.2"
path = "/root/git/xal"

[fil.repository]
remote = "https://github.com/xnvme/fil"
tag = "v0.3.3"
path = "/root/git/fil"

[spdk.repository]
remote = "https://github.com/spdk/spdk"
tag = "v26.01"
path = "/root/git/spdk"

[fio.repository]
remote = "https://github.com/axboe/fio"
tag = "fio-3.41"
path = "/root/git/fio"
