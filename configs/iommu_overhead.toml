[iommu_overhead]
runtime = 30
repeat = 5
fio_ramp_time = 10
fio_size = "100%"
workload_pause = 10
hugepages = 1024
# iommu.strict=1 only reaches devices on the kernel DMA API. vfio invalidates on
# every unmap anyway and uPCIe maps its buffers once, so the measured path is
# the same either way.
iommu_strict = false

# Every run also needs a config with [[devices]] entries, such as
# configs/devices_16.toml. Devices are pinned automatically by order:
# device 0 -> CPU 0, device 1 -> CPU 1, and so on.

[[iommu_overhead.workloads]]
rw = "randread"
iosize = 4096
iodepths = [1, 2, 4, 8, 16, 32]

[[iommu_overhead.workloads]]
rw = "read"
iosize = 131072
iodepths = [1, 2, 4, 8, 16, 32]
